<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrdemDEX-Ameaças</title>
    <link rel="stylesheet" href="css/ameacas.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Girassol&family=M+PLUS+1:wght@100..900&display=swap');
    </style>
</head>
<body>
    <header>
        <h1>OrdemDEX</h1>
        <h2>Ameaças</h2>
    </header>
    
    <p class="instrucoes">Pesquise uma ameaça do livro:</p>

    <div class="buscar">
        <input type="text" id="inputAmeaca" placeholder="Ex: Zumbi de sangue, Magistrada... "
            onkeydown="if(event.key==='Enter') buscar()" />
        <button class="Buscar" onclick="buscar()">BUSCAR</button>
    </div>

    <br>

    <div id="resultado"></div>

    <script>
        async function buscar() {
            const termoBusca = document.getElementById('inputAmeaca').value.trim();
            const div = document.getElementById('resultado');

            if (!termoBusca) {
                div.innerHTML = '<div class="erro">Digite o nome da ameaça!</div>';
                return;
            }

            div.innerHTML = '<div class="carregando">Buscando...</div>';

            try {
                const resposta = await fetch(`http://localhost:3000/ameacas/nome/${termoBusca}`);
                const dados = await resposta.json();

                if (!resposta.ok) {
                    div.innerHTML = `<div class="erro">${dados.mensagem || "Ameaça não encontrada"}</div>`;
                    return;
                }

                // Função auxiliar para converter textos vindos do MySQL em JSON válido
                const converterJSON = (valor, padrao) => {
                    if (!valor) return padrao;
                    if (typeof valor === 'string') {
                        try { return JSON.parse(valor); } catch { return padrao; }
                    }
                    return valor;
                };

                // Tratamento seguro dos dados retornados
                const tipos = converterJSON(dados.tipos, []);
                const vulnerabilidades = converterJSON(dados.vulnerabilidades, []);
                const acoes = converterJSON(dados.acoes, []);
                const resistencias = converterJSON(dados.resistencias, {});

                // Montagem dos elementos HTML
                const tiposHTML = tipos
                    .map(t => `<span class="tipo ${t.toLowerCase()}"> ${t}</span>`)
                    .join('');

                const presencaHTML = dados.presenca_perturbadora 
                    ? `<div class="bloco-presenca">
                            <span class="faixa-texto">PRESENÇA PERTURBADORA</span>
                            <div class="faixa-conteudo">${dados.presenca_perturbadora}</div>
                        </div><br>` 
                    : '';

                const atributosHTML = `
                    <div class="atributos-container">
                        <h3 class="titulo-atributos">ATRIBUTOS</h3>
                        <div class="atributos-lista">
                            <div class="atributo-item"><span class="atributo-label">AGI</span><div class="hexagono"><span>${dados.agilidade}</span></div></div>
                            <div class="atributo-item"><span class="atributo-label">FOR</span><div class="hexagono"><span>${dados.forca}</span></div></div>
                            <div class="atributo-item"><span class="atributo-label">INT</span><div class="hexagono"><span>${dados.inteligencia}</span></div></div>
                            <div class="atributo-item"><span class="atributo-label">PRE</span><div class="hexagono"><span>${dados.presenca}</span></div></div>
                            <div class="atributo-item"><span class="atributo-label">VIG</span><div class="hexagono"><span>${dados.vigor}</span></div></div>
                        </div>
                    </div>`;

                const vulnerabilidadeHTML = vulnerabilidades.length > 0
                    ? `<div class="label">Fraqueza</div>
                       ${vulnerabilidades.map(v => `<span class="tipo ${v.toLowerCase()}">${v}</span>`).join(' ')}`
                    : '<div class="label">Fraqueza</div> <span style="font-style: italic; color: #ccc;">Nenhuma</span>';

                const arrayResistencias = Object.entries(resistencias);
                const resistenciasHTML = arrayResistencias.length > 0
                    ? arrayResistencias.map(([nome, valor]) => `
                        <div><span style="text-transform: capitalize;">${nome}</span>: ${valor}</div>
                      `).join('')
                    : '<div class="null">Nenhuma</div>';
                
                const enigmaHTML = dados.enigma_medo 
                    ? `<div class="enigma-medo"><strong id="Enigma">Enigma de Medo:</strong> ${dados.enigma_medo}</div><br>` 
                    : '';

                const acoesHTML = acoes.length > 0 
                    ? acoes.map(a => `
                        <div class="acao-item">
                            <div>◆ ${a.tipo || 'AÇÃO'}</div>
                            <div class="corpo-item">
                                <div><strong>${a.nome}</strong></div>
                                ${a.teste ? `<div><strong>TESTE</strong> ${a.teste} | <strong>DANO</strong> ${a.dano}</div>` : ''}
                                ${a.efeito ? `<div>${a.efeito}</div>` : ''}
                            </div>
                        </div>
                    `).join('') 
                    : '<div class="erro">Nenhuma ação cadastrada</div>';

                div.innerHTML = `
                    <div class="card">
                        <h2 class="nomeAmeaca">${dados.nome}</h2>
                        <div class="tipos">${tiposHTML}</div>
                        <br>
                        <div id="img-texto">
                            <img src="${dados.img || 'https://via.placeholder.com/150'}" alt="Imagem de ${dados.nome}" class="imagem-criatura" />
                            <div class="descricao">${dados.descricao}</div>
                        </div>
                        <br>
                        ${presencaHTML}
                        ${atributosHTML}
                        <br>
                        <div class='info-grid'>
                            <div class='info-item'><div class='label'>VD</div><div class='value'>${dados.vd}</div></div>
                            <div class='info-item'><div class='label'>Tamanho</div><div class='value'>${dados.tamanho}</div></div>
                            <div class='info-item'>
                                <div class='label'>PV Total</div><div class='value'>${dados.pv_max}</div>
                                <div class='label2'>Machucado</div><div class='value'>${dados.pv_machucado}</div>
                            </div>
                            <div class='info-item'><div class='label'>Defesa</div><div class='value'>${dados.defesa}</div></div>
                            <div class='info-item'><div class='label'>Deslocamento</div><div class='value'>${dados.deslocamento}</div></div>
                        </div>
                        <div class='info-grid-defesa'>
                            <div class='info-item'>
                                <div class='label'>Resistências</div>
                                <div class='value' style="font-size: medium;">${resistenciasHTML}</div>
                            </div>
                            <div class='info-item'>${vulnerabilidadeHTML}</div>
                        </div>
                        <br>
                        ${enigmaHTML}
                    </div>
                    <div class="card">
                        <div class='habilidades'>
                            <h3>AÇÕES</h3>
                            ${acoesHTML}
                        </div>
                    </div>
                `;
                
            } catch (e) {
                console.error(e);
                div.innerHTML = '<div class="erro">Erro ao conectar com o servidor. Verifique se a API e o banco de dados estão rodando.</div>';
            }
        }
    </script>
</body>
</html>
